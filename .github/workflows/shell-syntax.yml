name: Shell syntax checks

on:
  push:
    branches: [main]
    paths:
      - "**.sh"
      - ".github/workflows/shell-syntax.yml"
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/shell-syntax.yml"
  workflow_dispatch:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name "*.sh" -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done
